<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Afoufa">
<link rel="manifest" href="manifest.json">
<title>To Do Afoufa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <div>
      <p class="eyebrow">♡ TO DO AFOUFA</p>
      <h1>Hello, Afoufa 🌷</h1>
      <p class="subtitle">A little progress every day.</p>
    </div>
    <div class="flower">✿</div>
  </header>

  <section class="progress-card">
    <div class="progress-top">
      <div><span id="doneCount">0</span> of <span id="totalCount">0</span> completed</div>
      <strong id="progressPercent">0%</strong>
    </div>
    <div class="progress-track"><div id="progressBar"></div></div>
  </section>

  <section class="toolbar">
    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Active</button>
      <button class="filter" data-filter="completed">Done</button>
    </div>
  </section>

  <section id="taskList" class="tasks"></section>
  <div id="empty" class="empty">
    <div>🌸</div>
    <h2>No tasks yet</h2>
    <p>Add something small and make today feel productive.</p>
  </div>

  <button id="addBtn" class="add-btn">＋ <span>Add a task</span></button>
</main>

<div id="modal" class="modal hidden">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>New task ✨</h2>
    <label>Task</label>
    <input id="taskInput" maxlength="100" placeholder="What do you want to do?">
    <label>Category</label>
    <select id="categoryInput">
      <option>Personal</option><option>Work</option><option>Study</option><option>Health</option>
    </select>
    <div class="sheet-actions">
      <button id="cancelBtn" class="secondary">Cancel</button>
      <button id="saveBtn" class="primary">Add task</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
